version: "3.8"
services:
  mongodb:
    build:
      context: .
      dockerfile: dockerfile
    container_name: mongo_container
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: XXXXX
      MONGO_INITDB_ROOT_PASSWORD: XXXXX
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:


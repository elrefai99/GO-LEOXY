worker_processes auto;

events {
     worker_connections 1024;
}

http {
     include /etc/nginx/mime.types;
     default_type application/octet-stream;

     # Logging
     access_log /var/log/nginx/access.log;
     error_log /var/log/nginx/error.log;

     # Performance
     sendfile on;
     tcp_nopush on;
     keepalive_timeout 65;

     # Rate limiting zone for auth endpoints
     limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

     # Upload size limit (for prescription images)
     client_max_body_size 100M;

     upstream backend {
          server backend:5000;
     }

     # Redirect HTTP -> HTTPS
     server {
          listen 80;
          server_name _;
          return 301 https://$host$request_uri;
     }

     # HTTPS server
     server {
          listen 443 ssl;
          server_name _;

          # Security headers
          add_header X-Frame-Options "SAMEORIGIN" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-XSS-Protection "1; mode=block" always;
          add_header Referrer-Policy "strict-origin-when-cross-origin" always;
          add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

          # API proxy
          location /api/ {
               proxy_pass http://backend;
               proxy_http_version 1.1;
               proxy_set_header Host $host;
               proxy_set_header X-Real-IP $remote_addr;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Proto $scheme;
               proxy_set_header Referer $http_referer;
               proxy_set_header Connection "";
               proxy_set_header Content-Type $content_type;
               proxy_set_header Accept-Encoding "";
               proxy_set_header Accept-Language $http_accept_language;
               proxy_set_header Accept-Charset $http_accept_charset;
               proxy_set_header Accept $http_accept;
               proxy_set_header User-Agent $http_user_agent;
               proxy_set_header Cache-Control "no-store, no-cache, must-revalidate, post-check=0, pre-check=0";
               proxy_set_header Pragma "no-cache";
               proxy_pass_request_body on;
               proxy_set_header Transfer-Encoding "";
               proxy_buffering off;
               proxy_request_buffering off;
          }

          location /api/auth/ {
               limit_req zone=auth_limit burst=10 nodelay;
               proxy_pass http://backend;
               proxy_http_version 1.1;
               proxy_set_header Host $host;
               proxy_set_header X-Real-IP $remote_addr;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Proto $scheme;
               proxy_set_header Connection "";
               proxy_buffering off;
               proxy_request_buffering off;
          }

          # WebSocket proxy for Socket.io
          location /socket.io/ {
               proxy_pass http://backend;
               proxy_http_version 1.1;
               proxy_set_header Upgrade $http_upgrade;
               proxy_set_header Connection "upgrade";
               proxy_set_header Host $host;
               proxy_set_header X-Real-IP $remote_addr;
               proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
               proxy_set_header X-Forwarded-Proto $scheme;
               proxy_cache_bypass $http_upgrade;
          }
     }
}
